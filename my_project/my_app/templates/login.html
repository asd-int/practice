<!DOCTYPE html>
<html>
<head>
    <title>Вход в систему</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.21.5/dist/css/uikit.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="uk-card uk-card-default uk-card-body uk-width-1-3 uk-border-rounded">
        <h2 class="uk-text-center uk-text-bold">Вход в систему</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="uk-alert-danger uk-margin" uk-alert>
                    <p>{{ message }}</p>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="uk-margin">
                <input class="uk-input" type="text" name="username" placeholder="Логин" required autofocus>
            </div>
            <div class="uk-margin">
                <input class="uk-input" type="password" name="password" placeholder="Пароль" required>
            </div>
            <button class="uk-button uk-button-primary uk-width-1-1" type="submit">Войти</button>
        </form>

        <div class="uk-text-center uk-margin-top uk-text-small uk-text-muted">
            Тестовые данные: <strong>ivan.petrov</strong> / <strong>123</strong>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.5/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.5/dist/js/uikit-icons.min.js"></script>
</body>
</html>
